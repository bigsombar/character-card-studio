<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base background (#1B1B1B) -->
  <rect width="1280" height="640" fill="#1B1B1B"/>

  <!-- Subtle decorative grid in the background -->
  <g stroke="#2F2F2F" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Left column: branding and description -->
  <g transform="translate(80, 96)">
    <!-- Top status badge -->
    <rect x="0" y="0" width="248" height="36" rx="8" fill="#2F2F2F" stroke="#404040" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="5" fill="#14A76C"/>
    <text x="36" y="23" fill="#F2F0E9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.8">
      CARD STUDIO // V3 EDITOR
    </text>

    <!-- Main heading -->
    <text x="0" y="106" fill="#F2F0E9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.5">
      Character Card
    </text>
    <text x="0" y="170" fill="#FFE400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.5">
      Studio
    </text>

    <!-- Subtitle -->
    <text x="0" y="228" fill="#B3B3B3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400">
      Free, local-first browser editor for
    </text>
    <text x="0" y="258" fill="#B3B3B3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400">
      CCv3 character cards &amp; lorebooks.
    </text>

    <!-- Format badges -->
    <g transform="translate(0, 304)">
      <rect x="0" y="0" width="96" height="38" rx="8" fill="#2F2F2F" stroke="#14A76C" stroke-width="1.5"/>
      <text x="48" y="24" text-anchor="middle" fill="#F2F0E9" font-family="monospace" font-size="15" font-weight="700">CHARX</text>

      <rect x="110" y="0" width="106" height="38" rx="8" fill="#2F2F2F" stroke="#404040" stroke-width="1.5"/>
      <text x="163" y="24" text-anchor="middle" fill="#F2F0E9" font-family="monospace" font-size="15" font-weight="700">V3 JSON</text>

      <rect x="230" y="0" width="96" height="38" rx="8" fill="#2F2F2F" stroke="#404040" stroke-width="1.5"/>
      <text x="278" y="24" text-anchor="middle" fill="#F2F0E9" font-family="monospace" font-size="15" font-weight="700">V3 PNG</text>

      <rect x="340" y="0" width="114" height="38" rx="8" fill="#2F2F2F" stroke="#404040" stroke-width="1.5"/>
      <text x="397" y="24" text-anchor="middle" fill="#B3B3B3" font-family="monospace" font-size="15" font-weight="600">LOREBOOK</text>
    </g>

    <!-- Bottom caption (GitHub URL) -->
    <text x="0" y="424" fill="#B3B3B3" font-family="monospace" font-size="16">
      bigsombar.github.io/character-card-studio
    </text>
  </g>

  <!-- Right column: stylized editor UI mockup -->
  <g transform="translate(710, 88)">
    <!-- Editor window -->
    <rect x="0" y="0" width="490" height="464" rx="16" fill="#2F2F2F" stroke="#404040" stroke-width="2"/>
    
    <!-- Window header -->
    <rect x="0" y="0" width="490" height="48" rx="16" fill="#262626"/>
    <rect x="0" y="32" width="490" height="16" fill="#262626"/>
    <line x1="0" y1="48" x2="490" y2="48" stroke="#404040" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#404040"/>
    <circle cx="44" cy="24" r="6" fill="#404040"/>
    <circle cx="64" cy="24" r="6" fill="#14A76C"/>
    <text x="90" y="29" fill="#B3B3B3" font-family="monospace" font-size="13">card.json — CCv3 Spec Valid</text>

    <!-- Character card inside the mockup -->
    <g transform="translate(24, 72)">
      <!-- Avatar placeholder -->
      <rect x="0" y="0" width="84" height="104" rx="10" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
      <circle cx="42" cy="38" r="16" fill="#404040"/>
      <path d="M18 86C18 71 28 62 42 62C56 62 66 71 66 86" fill="#404040"/>

      <!-- Character fields -->
      <rect x="102" y="0" width="340" height="44" rx="8" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
      <text x="116" y="17" fill="#B3B3B3" font-family="sans-serif" font-size="10" font-weight="600">NAME</text>
      <text x="116" y="34" fill="#F2F0E9" font-family="sans-serif" font-size="14" font-weight="600">Nora Bennett</text>

      <!-- TAGS field with three tags -->
      <rect x="102" y="56" width="340" height="48" rx="8" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
      <text x="116" y="73" fill="#B3B3B3" font-family="sans-serif" font-size="10" font-weight="600">TAGS</text>
      
      <rect x="116" y="80" width="126" height="18" rx="4" fill="#2F2F2F"/>
      <text x="179" y="92" text-anchor="middle" fill="#F2F0E9" font-family="monospace" font-size="10">character-card-v3</text>
      
      <rect x="248" y="80" width="48" height="18" rx="4" fill="#2F2F2F"/>
      <text x="272" y="92" text-anchor="middle" fill="#F2F0E9" font-family="monospace" font-size="10">charx</text>
      
      <rect x="302" y="80" width="66" height="18" rx="4" fill="#2F2F2F"/>
      <text x="335" y="92" text-anchor="middle" fill="#F2F0E9" font-family="monospace" font-size="10">lorebook</text>
    </g>

    <!-- Lorebook section inside the mockup -->
    <g transform="translate(24, 198)">
      <text x="0" y="14" fill="#F2F0E9" font-family="sans-serif" font-size="13" font-weight="700">LOREBOOK ENTRIES</text>
      
      <!-- Active entry (Jade #14A76C) -->
      <rect x="0" y="26" width="442" height="44" rx="8" fill="#1B1B1B" stroke="#14A76C" stroke-width="1.5"/>
      <circle cx="18" cy="48" r="5" fill="#14A76C"/>
      <text x="34" y="53" fill="#F2F0E9" font-family="sans-serif" font-size="13.5" font-weight="600">World Lore &amp; Timeline</text>
      <text x="424" y="52" text-anchor="end" fill="#14A76C" font-family="monospace" font-size="11">ACTIVE</text>

      <!-- Second entry -->
      <rect x="0" y="80" width="442" height="44" rx="8" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
      <circle cx="18" cy="102" r="5" fill="#14A76C"/>
      <text x="34" y="107" fill="#F2F0E9" font-family="sans-serif" font-size="13.5">Key Locations &amp; Factions</text>
    </g>

    <!-- Export button at the bottom of the mockup (Yellow #FFE400 + On accent #171717) -->
    <g transform="translate(24, 384)">
      <rect x="0" y="0" width="442" height="52" rx="10" fill="#FFE400"/>
      <text x="221" y="31" text-anchor="middle" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800">
        Export .CHARX Archive
      </text>
    </g>
  </g>
</svg>